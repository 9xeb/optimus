<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Optigraph Console</title>
<style>
  :root {
    --bg: #070b12; --bg-2: #0a0f18; --panel: #0e1522; --panel-2: #131c2c;
    --border: #22304a; --border-2: #2c3d5c;
    --text: #c9d4e6; --text-dim: #6d7f9b; --text-faint: #46566f;
    --accent: #35d0ff; --awake: #35d0ff; --sleeping: #3d4f6b;
    --failing: #ff4d5e; --ok: #34d399; --warn: #fbbf24; --match: #ffd166;
    --cursor: #ff4dd8;
    --action: #a78bfa; --question: #5fa8ff; --review: #34d399;
    --shadow: 0 10px 40px rgba(0,0,0,.5);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(1200px 700px at 78% -10%, rgba(53,208,255,.10), transparent 60%), radial-gradient(900px 600px at -5% 105%, rgba(167,139,250,.08), transparent 55%), var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #topbar { display: flex; align-items: center; gap: 18px; padding: 12px 18px; background: linear-gradient(180deg, rgba(19,28,44,.92), rgba(14,21,34,.78)); border-bottom: 1px solid var(--border); backdrop-filter: blur(8px); z-index: 20; }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: radial-gradient(circle at 30% 30%, #6fe6ff, #1aa7d6 60%, #0b4f6b); box-shadow: 0 0 22px rgba(53,208,255,.55), inset 0 0 12px rgba(255,255,255,.35); }
  .brand h1 { margin: 0; font-size: 15px; letter-spacing: .22em; font-weight: 700; }
  .brand .sub { margin: 1px 0 0; font-size: 10.5px; color: var(--text-faint); letter-spacing: .14em; text-transform: uppercase; }
  .chips { display: flex; gap: 8px; margin-left: 6px; }
  .chip { display: flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); font-size: 12px; color: var(--text-dim); user-select: none; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip .dot.awake { background: var(--awake); box-shadow: 0 0 8px var(--awake); }
  .chip .dot.sleeping { background: var(--sleeping); }
  .chip .dot.failing { background: var(--failing); box-shadow: 0 0 8px var(--failing); }
  .chip .n { font-family: var(--mono); color: var(--text); }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .status { font-size: 11px; color: var(--text-faint); font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
  .status .led { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status.error .led { background: var(--failing); box-shadow: 0 0 8px var(--failing); }
  .status.error { color: var(--failing); }
  .btn { font-family: var(--sans); font-size: 12.5px; cursor: pointer; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text); }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--border-2); }
  .btn.primary { background: linear-gradient(180deg, #2fc4f0, #1a95c4); border-color: #2fc4f0; color: #03202b; font-weight: 650; }
  .btn.ghost { background: transparent; }
  .btn.tiny { padding: 4px 9px; border-radius: 7px; font-size: 12px; }
  .btn.danger { color: var(--failing); }
  #stage { position: relative; flex: 1; overflow: hidden; }
  #graph { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; display: block; }
  #graph:active { cursor: grabbing; }
  .edge { fill: none; stroke: #2a3a55; stroke-width: 1.5; }
  .edge.unresolved { stroke: #4a3a5c; stroke-dasharray: 4 5; }
  .edge.proposal { stroke: #4a3a5c; stroke-dasharray: 4 5; }
  .edge.awake { stroke: var(--awake); stroke-width: 2.1; stroke-dasharray: 5 13; animation: dashflow 1s linear infinite; }
  .edge.match { stroke: var(--match); }
  @keyframes dashflow { to { stroke-dashoffset: -18; } }
  .node { cursor: pointer; }
  .node .core { stroke-width: 1.7; }
  .node .ring2 { fill: none; }
  .node .halo { pointer-events: none; }
  .node .anchor-ring { display: none; fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 5 4; opacity: .9; pointer-events: none; }
  .node.anchor .anchor-ring { display: block; }
  .node .fresh { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; opacity: .85; }
  .node .label { font-family: var(--mono); font-size: 11px; fill: var(--text-dim); pointer-events: auto; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .node .fresh-track { fill: none; stroke: var(--border-2); stroke-width: 2.2; opacity: .55; pointer-events: none; }
  .node .fresh-arc { fill: none; stroke: var(--ok); stroke-width: 2.2; stroke-linecap: round; pointer-events: none; }
  .node.proposal .fresh-track, .node.proposal .fresh-arc, .node.temp .fresh-track, .node.temp .fresh-arc { display: none; }
  .node.state-sleeping .core { fill: #131c2b; stroke: var(--sleeping); }
  .node.state-sleeping .label { fill: var(--text-faint); }
  .node.state-awake .core { fill: #062b3a; stroke: var(--awake); }
  .node.state-awake .halo { fill: var(--awake); opacity: .12; animation: breathe 1.7s ease-in-out infinite; }
  .node.state-awake.live .halo { animation: none; opacity: calc(.10 + var(--activity, 0) * .40); transition: opacity .18s linear; }
  .node.state-awake .label { fill: #b8ecff; }
  .node.state-failing .core { fill: #2a0b12; stroke: var(--failing); }
  .node.state-failing .halo { fill: var(--failing); opacity: .16; animation: breathe 1.05s ease-in-out infinite; }
  .node.state-failing .label { fill: #ffc0c6; }
  .node.review .anchor-ring { display: block; stroke-dasharray: none; stroke-width: 2.6; opacity: 1; filter: drop-shadow(0 0 6px rgba(251,191,36,.5)); }
  .node.review .halo { display: block; fill: var(--warn); opacity: .10; animation: reviewpulse 2.6s ease-in-out infinite; }
  @keyframes reviewpulse { 0%, 100% { opacity: .08; } 50% { opacity: .26; } }
  @keyframes breathe { 0%,100% { opacity: .10; } 50% { opacity: .30; } }
  .node.kind-simple .ring2 { display: none; }
  .node.kind-complex .core { stroke-width: 2.4; }
  .node.kind-complex .ring2 { display: block; stroke: var(--border-2); stroke-dasharray: 3 4; opacity: .8; }
  .node.kind-root .core { stroke-width: 3.2; }
  .node.kind-root .ring2 { display: block; stroke: var(--accent); stroke-width: 1.6; opacity: .9; }
  .node.kind-root .label { font-weight: 700; font-size: 12px; fill: #e6faff; }
  .node.proposal .core { fill: rgba(251,191,36,.06); stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.8; }
  .node.proposal .ring2, .node.proposal .halo { display: none; }
  .node.proposal .label { fill: var(--warn); opacity: .85; font-size: 10.5px; }
  .node.temp .core { fill: #0e1522; stroke: var(--text-faint); stroke-dasharray: 4 5; }
  .node.temp .ring2, .node.temp .halo { display: none; }
  .node.temp .label { fill: var(--text-faint); }
  .node.selected .core { stroke-width: 3.2; }
  .node .cursor-ring { display: none; fill: none; stroke: var(--cursor); stroke-width: 4; pointer-events: none; filter: drop-shadow(0 0 8px rgba(255,77,216,.95)); }
  .node.match-current .cursor-ring { display: block; animation: cursorpulse 1.1s ease-in-out infinite; }
  .node.match-current .core { stroke: var(--cursor) !important; stroke-width: 3.6; }
  .node.match-current .halo { fill: var(--cursor); animation: cursorpulse 1.1s ease-in-out infinite; }
  .node.match-current .label { fill: #ffd6fb; }
  @keyframes cursorpulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  #graph.find-active .node:not(.match) { opacity: .13; }
  #graph.find-active .edge:not(.match) { opacity: .06; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #empty.hidden { display: none; }
  #empty .card { pointer-events: auto; text-align: center; max-width: 380px; padding: 30px 34px; border-radius: 16px; background: rgba(14,21,34,.82); border: 1px solid var(--border); box-shadow: var(--shadow); }
  #empty h2 { margin: 0 0 6px; font-size: 18px; }
  #empty p { margin: 0 0 18px; color: var(--text-dim); font-size: 13px; }
  #findbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; z-index: 16; background: rgba(14,21,34,.95); border: 1px solid var(--border-2); padding: 6px 8px; border-radius: 10px; box-shadow: var(--shadow); }
  #findbar.hidden { display: none; }
  #find-input { width: 320px; background: transparent; border: none; outline: none; color: var(--text); font-size: 13px; }
  #find-count { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); min-width: 62px; text-align: right; }
  #find-count.zero { color: var(--failing); }
  #legend { position: absolute; left: 16px; bottom: 16px; z-index: 10; background: rgba(10,15,24,.72); border: 1px solid var(--border); border-radius: 11px; padding: 10px 13px; font-size: 11.5px; color: var(--text-dim); display: grid; gap: 6px; backdrop-filter: blur(6px); }
  .legend-row { display: flex; align-items: center; gap: 8px; }
  .legend-sep { height: 1px; background: var(--border); margin: 2px 0; }
  .legend-row .dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-row .dot.awake { background: var(--awake); box-shadow: 0 0 8px var(--awake); }
  .legend-row .dot.sleeping { background: var(--sleeping); }
  .legend-row .dot.failing { background: var(--failing); box-shadow: 0 0 8px var(--failing); }
  .legend-row .shape { width: 13px; height: 13px; border-radius: 50%; border: 1.8px solid var(--sleeping); }
  .legend-row .shape.complex { width: 16px; height: 16px; border-width: 3px; border-style: double; }
  .legend-row .shape.root { width: 18px; height: 18px; border-width: 3px; border-color: var(--accent); }
  .legend-row .shape.proposal { width: 13px; height: 13px; border-style: dashed; border-color: var(--warn); }
  #drawer { position: absolute; top: 0; right: 0; height: 100%; width: 500px; max-width: 92vw; background: linear-gradient(180deg, var(--panel), var(--bg-2)); border-left: 1px solid var(--border); box-shadow: -18px 0 50px rgba(0,0,0,.45); transform: translateX(102%); transition: transform .26s, width .2s; z-index: 30; display: flex; flex-direction: column; }
  #drawer.open { transform: translateX(0); }
  #drawer.wide { width: min(78vw, 1000px); }
  .pane > header .actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .detail-body { padding: 18px; overflow: auto; flex: 1; outline: none; }
  .detail-body:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
  .reader-run { color: var(--awake); border-color: rgba(53,208,255,.45); }
  .reader-run:disabled { color: var(--text-faint); border-color: var(--border); cursor: default; }
  .reader-run:disabled:hover { background: transparent; }
  .run-note { margin: 0 0 12px; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border); background: rgba(7,11,18,.5); font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
  .run-note.error { border-color: rgba(255,77,94,.45); color: #ffc0c6; }
  .pane { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .pane > header { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--border); }
  .pane > header h2 { margin: 0; font-size: 14px; letter-spacing: .04em; }
  .detail-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .detail-title .name { font-family: var(--mono); font-size: 15px; font-weight: 650; color: #dff3ff; overflow-wrap: anywhere; word-break: normal; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .09em; border: 1px solid var(--border-2); color: var(--text-dim); }
  .badge.state-awake { color: var(--awake); border-color: var(--awake); }
  .badge.state-sleeping { color: var(--text-dim); }
  .badge.state-failing { color: var(--failing); border-color: var(--failing); }
  .badge.state-complete { color: var(--ok); border-color: var(--ok); }
  .badge.state-idle { color: var(--text-faint); }
  .badge.kind-complex { color: var(--warn); border-color: var(--warn); }
  .badge.kind-root { color: var(--accent); border-color: var(--accent); }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 16px 0; }
  .meta { display: flex; flex-direction: column; gap: 3px; }
  .meta .k { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  .meta .v { font-size: 12.5px; font-family: var(--mono); }
  .freshbar { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: 5px; }
  .freshbar > i { display: block; height: 100%; background: var(--accent); }
  .section { margin-top: 20px; }
  .section > h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-faint); margin: 0 0 9px; font-weight: 600; }
  .instruction { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .dep-list { display: flex; flex-wrap: wrap; gap: 7px; }
  .dep { font-family: var(--mono); font-size: 11.5px; cursor: pointer; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim); }
  .dep:hover { border-color: var(--accent); color: var(--text); }
  .dep.unresolved { border-style: dashed; color: var(--text-faint); cursor: default; }
  .empty-note { font-size: 12.5px; color: var(--text-faint); font-style: italic; }
  pre.report { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin: 0; }
  .proposal-card { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 12px; }
  .proposal-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .proposal-name { font-family: var(--mono); font-size: 13px; font-weight: 650; color: #ffe7a3; word-break: break-all; }
  .proposal-ttl { margin-left: auto; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
  .proposal-instruction { margin-top: 6px; font-size: 12.5px; line-height: 1.5; color: var(--text-dim); white-space: pre-wrap; }
  .proposal-deps { margin-top: 6px; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
  .proposal-link { margin-left: 10px; padding: 0; border: 0; background: none; font-family: var(--mono); font-size: 11px; color: var(--accent); cursor: pointer; }
  .proposal-link:hover { color: #9be9ff; text-decoration: underline; }
  .proposal-link:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .proposal-card pre.report { margin-top: 8px; }
  .justify-card { border-left: 3px solid var(--action); background: rgba(167,139,250,.045); }
  .justify-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--action); margin-bottom: 5px; }
  .justify-text { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .tool-details { border: 1px solid var(--border); border-radius: 8px; background: rgba(14,21,34,.5); }
  .tool-details > summary { display: flex; align-items: baseline; gap: 2px; padding: 8px 10px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); cursor: pointer; list-style: none; }
  .tool-details > summary::-webkit-details-marker { display: none; }
  .tool-details > summary::before { content: '▸'; color: var(--text-faint); margin-right: 6px; font-size: 10px; }
  .tool-details[open] > summary::before { content: '▾'; }
  .tool-details > summary:focus-visible { outline: 1px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
  .tool-details[open] > summary { border-bottom: 1px solid var(--border); }
  .tool-thumb { color: var(--text-faint); }
  .tool-details .proposal-deps { margin: 8px 10px 0; }
  .tool-details pre.report { margin: 6px 10px 10px; }
  #composer { flex: 0 0 auto; border-top: 1px solid var(--border); background: linear-gradient(180deg, rgba(14,21,34,.97), rgba(10,15,24,.99)); padding: 10px 18px 12px; z-index: 20; }
  #composer.event-task { border-top-color: rgba(251,191,36,.5); }
  #composer.event-action { border-top-color: rgba(167,139,250,.5); }
  #composer.event-question { border-top-color: rgba(95,168,255,.5); }
  #composer.event-review { border-top-color: rgba(52,211,153,.5); }
  #composer.mode-notice { border-top-color: rgba(255,77,94,.5); }
  #composer-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; min-height: 18px; }
  #composer-kind { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
  #composer.event-task #composer-kind { color: var(--warn); border-color: rgba(251,191,36,.6); }
  #composer.event-action #composer-kind { color: var(--action); border-color: rgba(167,139,250,.6); }
  #composer.event-question #composer-kind { color: var(--question); border-color: rgba(95,168,255,.6); }
  #composer.event-review #composer-kind { color: var(--review); border-color: rgba(52,211,153,.6); }
  #composer.mode-busy #composer-kind { color: var(--awake); border-color: rgba(53,208,255,.5); }
  #composer.mode-notice #composer-kind { color: var(--failing); border-color: rgba(255,77,94,.6); }
  #composer-summary { font-size: 12.5px; color: var(--text-dim); min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .task-ref { display: inline-block; max-width: 100%; padding: 0 1px; border: 0; background: none; font: inherit; color: var(--text); cursor: pointer; vertical-align: bottom; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: underline dotted; text-underline-offset: 2px; }
  .task-ref:hover { color: var(--action); text-decoration-color: var(--action); }
  .task-ref:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--action); border-radius: 3px; }
  .task-ref-missing { color: var(--text-faint); }
  #composer-details { max-height: 40vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 8px; }
  #composer-details .proposal-card { background: rgba(14,21,34,.6); }
  #live { margin: 2px 0 6px; padding: 3px 10px; border: 1px solid var(--border); border-radius: 8px; background: rgba(7,11,18,.62); }
  #live-head { display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); font-size: 10.5px; line-height: 1.3; color: var(--text-faint); }
  #live-task { color: #b8ecff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #live-meta { margin-left: auto; white-space: nowrap; }
  #live-meta[data-status="streaming"] { color: var(--awake); }
  #live-meta[data-status="stalled"], #live-meta[data-status="ended"] { color: var(--warn); }
  #live-tail { height: calc(3 * 1.35em); overflow: hidden; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.35; color: var(--text); }
  #live-text { white-space: pre-wrap; }
  #live-caret { color: var(--awake); margin-left: 1px; animation: livecaret 1.05s steps(1) infinite; }
  #live-caret.quiet { animation: none; opacity: .25; }
  @keyframes livecaret { 0%, 49% { opacity: .15; } 50%, 100% { opacity: 1; } }
  #composer-row { display: flex; align-items: flex-end; gap: 10px; }
  #composer-row.hidden { display: none; }
  #composer-input { flex: 1; min-height: 38px; max-height: 168px; resize: none; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.5; padding: 9px 11px; }
  #composer-input:focus { outline: none; border-color: var(--accent); }
  #composer-input:disabled { opacity: .55; }
  #composer.mode-busy #composer-input { border-color: var(--border-2); opacity: .78; }
  #composer-actions { display: flex; gap: 8px; }
  #composer-foot { display: flex; align-items: center; gap: 10px; margin-top: 7px; min-height: 16px; }
  #composer-hint { flex: 1; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
  #composer-status { font-size: 11px; color: var(--text-dim); font-family: var(--mono); text-align: right; }
  #composer-status.error { color: var(--failing); }
  #composer-retry { padding: 2px 8px; }
  #breadcrumb { position: absolute; top: 14px; left: 16px; z-index: 12; display: flex; align-items: center; gap: 8px; max-width: min(46vw, 460px); padding: 6px 13px; border-radius: 999px; background: rgba(14,21,34,.92); border: 1px solid var(--border-2); color: var(--text-dim); font-size: 12px; font-family: var(--mono); cursor: pointer; overflow: hidden; }
  #breadcrumb:hover { border-color: var(--accent); }
  #breadcrumb .bc-back { color: var(--accent); white-space: nowrap; }
  #breadcrumb .bc-sep { color: var(--text-faint); }

<body>
<div id="app">
  <header id="topbar">

    </div>
  </header>

    <button id="breadcrumb" class="hidden" title="Back to overview"></button>

      <span id="composer-status"></span>

    </div>
  </section>
</div>
<script type="module">
import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';
import dagre from 'https://cdn.jsdelivr.net/npm/@dagrejs/dagre@1/+esm';
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@13/+esm';
import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3/+esm';

const TASKS_URL = '/tasks', REVIEW_URL = '/review', POLL_INTERVAL = 2000, DEFAULT_TTL = 60;
const STREAM_URL = '/tasks/stream';
const STREAM_QUIET_MS = 2000, STREAM_STALL_MS = 15000;
const STREAM_MAX_CHARS = 64 * 1024, STREAM_WINDOW_CHARS = 2000, STREAM_TAIL_LINES = 6;
const LABEL_MAX_CHARS = 22, LABEL_CHAR_W = 6.6, LABEL_LINE_H = 13, LABEL_GAP = 16;
const EVENT_LABELS = { 'task-proposal': 'TASK', 'tool-approval': 'ACTION', 'question': 'QUESTION', 'review': 'REVIEW' };
const EVENT_CLASSES = { 'task-proposal': 'event-task', 'tool-approval': 'event-action', 'question': 'event-question', 'review': 'event-review' };

const state = {
  tasks: new Map(),
  focusRootId: null,
  selectedId: null,
  anchorId: null,
  tempRoot: null,
  tempBaseline: null,
  situation: null,
  situationSig: null,
  situationStatus: 'idle',
  taskDraft: '',
  reviewDraft: '',
  submitError: null,
  reviewError: null,
  composerMode: null,
  actionLock: false,
  actionLockTimer: null,
  layout: null,
  signature: null,
  viewport: d3.zoomIdentity,
  readerDismissedFor: null,
  run: { id: null, pending: false, error: null },
  stream: {
    status: 'idle',
    task: null,
    startedAt: null,
    lastChunkAt: null,
    lastPingAt: null,
    raw: '',
    chunkTimes: [],
    rate: 0,
    midTask: false,
    toolOnly: false,
    lastText: '',
    lastTextAt: 0,
    rendered: '',
    headerAt: 0,
    observedStart: false,
    lastRefreshAt: 0,
  },
  awakeSince: new Map(),
  envelopeSeen: false,
  find: { open: false, query: '', matches: [], index: 0, returnFocus: null },
  error: null,
};

function el(t, p = {}, c = []) {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(p)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v != null) n.setAttribute(k, v);
  }
  for (const x of [].concat(c)) {
    if (x == null) continue;
    n.append(typeof x === 'string' ? document.createTextNode(x) : x);
  }
  return n;
}

function normKind(k) { return k === 'root' ? 'root' : (k === 'complex' ? 'complex' : 'simple'); }
function normState(s) { return s === 'awake' ? 'awake' : (s === 'failing' ? 'failing' : 'sleeping'); }
function nodeRadius(t) { return t && t.kind === 'root' ? 26 : (t && t.kind === 'complex' ? 26 : 18); }
function ghostId(title) { return '__sit__:' + title; }
function freshness(t) {
  if (!t.reportAt) return 0;
  const at = Date.parse(t.reportAt);
  if (!isFinite(at)) return 0;
  const age = (Date.now() - at) / (t.ttl * 60 * 1000);
  return Math.max(0, Math.min(1, 1 - age));
}
function relTime(ts) {
  const at = Date.parse(ts);
  if (!isFinite(at)) return '—';
  const m = Math.max(0, Math.round((Date.now() - at) / 60000));
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m ago`;
}
function wrapTitle(title, maxChars = LABEL_MAX_CHARS) {
  const words = String(title || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  const push = s => { if (s) lines.push(s); };
  for (let word of words) {
    while (word.length > maxChars) {
      if (line) { push(line); line = ''; }
      push(word.slice(0, maxChars));
      word = word.slice(maxChars);
    }
    if (!word) continue;
    const next = line ? `${line} ${word}` : word;
    if (line && next.length > maxChars) { push(line); line = word; }
    else line = next;
  }
  push(line);
  if (!lines.length) lines.push('');
  return lines;
}
function labelMetrics(title) {
  const lines = wrapTitle(title);
  const width = Math.max(1, ...lines.map(l => l.length)) * LABEL_CHAR_W;
  return { lines, width, height: lines.length * LABEL_LINE_H };
}
function reportStatus(t) {
  if (t.state === 'failing') return { label: 'failing', cls: 'state-failing' };
  if (t.state === 'awake') return { label: 'working', cls: 'state-awake' };
  if (t.report) return { label: 'complete', cls: 'state-complete' };
  return { label: 'not yet run', cls: 'state-idle' };
}
function canRunTask(t) {
  return !!t
    && t.state !== 'awake'
    && awakeCount() === 0
    && !state.situation
    && !state.submitting
    && !state.run.pending
    && !state.error;
}
function runBlockedReason(t) {
  if (!t) return '';
  if (t.state === 'awake') return 'Task is already running';
  if (awakeCount() > 0) return 'Another task is running';
  if (state.situation) return 'Resolve the current situation first';
  if (state.submitting) return 'A task submission is in flight';
  if (state.run.pending) return 'Starting…';
  if (state.error) return 'Backend unreachable';
  return 'Run this task now';
}

function normalizeSituation(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  const type = typeof raw.type === 'string' ? raw.type : '';
  if (!type) return null;
  const parent = raw.parent != null && String(raw.parent).trim() ? String(raw.parent) : null;
  if (type === 'question') {
    if (raw.question == null || !String(raw.question).trim()) return null;
    return { type, parent, question: String(raw.question) };
  }
  if (type === 'task-proposal') {
    const list = Array.isArray(raw.tasks) ? raw.tasks : [];
    const tasks = list.map(t => ({
      title: String(t.title || t.id || ''),
      task: String(t.task || t.instruction || ''),
      kind: normKind(t.kind),
      dependencies: Array.isArray(t.dependencies) ? t.dependencies.map(String) : [],
      ttl: Number(t.ttl) > 0 ? Number(t.ttl) : DEFAULT_TTL,
    })).filter(t => t.title);
    if (!tasks.length) return null;
    return { type, parent, tasks };
  }
  if (type === 'tool-approval') {
    const tool = raw.tool != null ? String(raw.tool).trim() : '';
    if (!tool) return { type, parent, unsupported: true };
    const args = raw.args == null ? {} : raw.args;
    const justification = raw.justification == null ? '' : String(raw.justification).trim();
    return { type, parent, tool, args, justification };
  }
  if (type === 'review') {
    const task = raw.task != null && String(raw.task).trim() ? String(raw.task) : null;
    return { type, parent: task };
  }
  return { type, parent, unsupported: true };
}
function situationSignature(s) { return s ? JSON.stringify(s) : null; }

function applyTasks(raw) {
  const arr = Array.isArray(raw)
    ? raw
    : (raw && typeof raw === 'object' ? Object.entries(raw).map(([k, v]) => ({ title: k, ...(v || {}) })) : []);
  const map = new Map();
  for (const t of arr) {
    const id = t.title || t.id || t.name;
    if (!id) continue;
    map.set(id, {
      id,
      title: id,
      instruction: t.task || t.instruction || '',
      deps: Array.isArray(t.dependencies) ? t.dependencies.map(String) : [],
      kind: normKind(t.kind),
      state: normState(t.state),
      ttl: Number(t.ttl) > 0 ? Number(t.ttl) : DEFAULT_TTL,
      report: t.report || '',
      reportAt: t.timestamp || t.reportAt || null,
    });
  }
  return map;
}

function getRoots() { return [...state.tasks.values()].filter(t => t.kind === 'root'); }
function getClosure(rid) {
  const seen = new Set([rid]);
  const q = [rid];
  while (q.length) {
    const c = q.shift();
    const t = state.tasks.get(c);
    if (!t) continue;
    for (const d of t.deps) {
      if (!seen.has(d) && state.tasks.has(d)) { seen.add(d); q.push(d); }
    }
  }
  return seen;
}
function rootOwning(id) {
  if (!state.tasks.has(id)) return null;
  if (state.tasks.get(id).kind === 'root') return id;
  for (const r of getRoots()) {
    if (getClosure(r.id).has(id)) return r.id;
  }
  return null;
}
function revealAnchor(parent) {
  if (!parent || !state.tasks.has(parent)) { state.anchorId = null; return; }
  state.anchorId = parent;
  const root = rootOwning(parent);
  if (root) state.focusRootId = root;
}
function activeGhosts() {
  const s = state.situation;
  if (!s || s.type !== 'task-proposal' || s.unsupported || state.situationStatus === 'settled') return [];
  return s.tasks;
}

function applyEnvelope(env) {
  const prevAwake = currentAwakeTask();
  state.tasks = applyTasks(env.tasks);
  trackAwake(prevAwake);
  if (state.tempRoot && state.tempBaseline && getRoots().some(r => !state.tempBaseline.has(r.id))) {
    state.tempRoot = null;
  }
  const next = normalizeSituation(env.situation);
  const sig = situationSignature(next);
  const changed = sig !== state.situationSig;
  if (changed) {
    state.situation = next;
    state.situationSig = sig;
    state.situationStatus = 'idle';
    state.reviewDraft = '';
    state.reviewError = null;
    state.actionLock = true;
    if (state.actionLockTimer) clearTimeout(state.actionLockTimer);
    state.actionLockTimer = setTimeout(() => {
      state.actionLock = false;
      state.actionLockTimer = null;
      renderComposer();
    }, 300);
    if (next) revealAnchor(next.parent);
    else state.anchorId = null;
  }
  if (state.focusRootId && !state.tasks.has(state.focusRootId)) state.focusRootId = null;
  if (state.selectedId && !state.tasks.has(state.selectedId)) state.selectedId = null;
  if (state.anchorId && !state.tasks.has(state.anchorId)) state.anchorId = null;
  if (state.find.query.trim()) recomputeFind(false);
  render();
  syncStream();
}

const svg = d3.select('#graph'), g = svg.append('g'), edgeL = g.append('g'), nodeL = g.append('g');
svg.append('defs').append('marker').attr('id', 'arr').attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5).attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto-start-reverse').append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'context-stroke');
const zoom = d3.zoom().scaleExtent([.12, 4]).on('zoom', e => { state.viewport = e.transform; g.attr('transform', e.transform); });
svg.call(zoom).on('dblclick.zoom', null);
svg.on('click', e => {
  if (e.target !== svg.node()) return;
  if (!state.selectedId && !state.focusRootId) return;
  clearSelection();
});

function build() {
  const L = { nodes: new Map(), edges: [] };
  L.ghosts = new Set();
  const ghosts = activeGhosts();
  const ghostTitles = new Set(ghosts.map(g => g.title));
  const expanded = state.find.open;
  if (expanded || (state.focusRootId && state.tasks.has(state.focusRootId))) {
    const cl = expanded ? new Set(state.tasks.keys()) : getClosure(state.focusRootId);
    const real = [...cl].map(id => state.tasks.get(id)).filter(Boolean);
    const gg = new dagre.graphlib.Graph();
    gg.setGraph({ rankdir: 'BT', nodesep: 50, ranksep: 80, marginx: 60, marginy: 60 });
    gg.setDefaultEdgeLabel(() => ({}));
    for (const t of real) {
      const r = nodeRadius(t), lm = labelMetrics(t.title);
      gg.setNode(t.id, { width: Math.max(r * 2 + 50, lm.width + 24), height: r * 2 + LABEL_GAP + lm.height });
    }
    for (const t of real) { for (const d of t.deps) { if (cl.has(d) && state.tasks.has(d)) gg.setEdge(d, t.id); } }
    for (const ghost of ghosts) {
      const gid = ghostId(ghost.title), lm = labelMetrics(ghost.title);
      L.ghosts.add(gid);
      gg.setNode(gid, { width: Math.max(18 * 2 + 50, lm.width + 24), height: 18 * 2 + LABEL_GAP + lm.height });
    }
    for (const ghost of ghosts) {
      const gid = ghostId(ghost.title);
      for (const d of ghost.dependencies) {
        if (cl.has(d) && state.tasks.has(d)) gg.setEdge(d, gid);
        else if (ghostTitles.has(d)) gg.setEdge(ghostId(d), gid);
      }
    }
    dagre.layout(gg);
    for (const id of gg.nodes()) {
      const nd = gg.node(id);
      if (L.ghosts.has(id)) {
        const ghost = ghosts.find(x => ghostId(x.title) === id);
        const title = ghost ? ghost.title : id;
        L.nodes.set(id, { x: nd.x, y: nd.y, r: 18, ghost: true, title, kind: ghost ? ghost.kind : 'simple', label: labelMetrics(title) });
      } else {
        const t = state.tasks.get(id);
        L.nodes.set(id, { x: nd.x, y: nd.y, r: nodeRadius(t), label: labelMetrics(t.title) });
      }
    }
    for (const e of gg.edges()) L.edges.push({ source: e.v, target: e.w, proposal: L.ghosts.has(e.v) || L.ghosts.has(e.w) });
  } else {
    const roots = getRoots();
    const R = Math.max(200, roots.length * 60);
    roots.forEach((r, i) => {
      const ang = (i / Math.max(1, roots.length)) * Math.PI * 2 - Math.PI / 2;
      L.nodes.set(r.id, { x: R * Math.cos(ang), y: R * Math.sin(ang), r: 26, label: labelMetrics(r.title) });
    });
    if (ghosts.length) {
      const y = -R - 140;
      ghosts.forEach((ghost, i) => {
        const gid = ghostId(ghost.title);
        L.ghosts.add(gid);
        L.nodes.set(gid, { x: (i - (ghosts.length - 1) / 2) * 150, y, r: 18, ghost: true, title: ghost.title, kind: ghost.kind, label: labelMetrics(ghost.title) });
      });
      for (const ghost of ghosts) {
        const gid = ghostId(ghost.title);
        for (const d of ghost.dependencies) {
          if (ghostTitles.has(d)) L.edges.push({ source: ghostId(d), target: gid, proposal: true });
          else if (state.tasks.has(d)) L.edges.push({ source: d, target: gid, proposal: true });
        }
      }
    }
    if (state.tempRoot) {
      L.nodes.set('__tmp__', { x: 0, y: -90, r: 18, ghost: true, temp: true, title: 'submitting…', kind: 'simple', label: labelMetrics('submitting…') });
    }
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of L.nodes.values()) {
    const lm = p.label || { width: 0, height: 0 };
    minX = Math.min(minX, p.x - Math.max(p.r, lm.width / 2));
    maxX = Math.max(maxX, p.x + Math.max(p.r, lm.width / 2));
    minY = Math.min(minY, p.y - p.r);
    maxY = Math.max(maxY, p.y + p.r + LABEL_GAP + lm.height);
  }
  if (L.nodes.size) L.bounds = { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
  return L;
}

function readerVisible() {
  return !!state.selectedId && state.readerDismissedFor !== state.selectedId;
}
function canvasWidth() {
  const graph = document.getElementById('graph');
  const w = graph.clientWidth || 800;
  if (!readerVisible()) return w;
  const drawer = document.getElementById('drawer');
  const dw = drawer.getBoundingClientRect().width || parseFloat(getComputedStyle(drawer).width) || 0;
  return Math.max(320, w - dw);
}
function selectNode(id, focusReader = false) {
  if (!state.tasks.has(id)) return;
  const root = rootOwning(id);
  if (root && !state.find.open) state.focusRootId = root;
  state.readerDismissedFor = null;
  state.selectedId = id;
  const relaid = render();
  if (!relaid) centerOn(id);
  if (focusReader) {
    const body = document.querySelector('#detail .detail-body');
    if (body) body.focus({ preventScroll: true });
  }
}
function clearSelection() {
  state.selectedId = null;
  state.readerDismissedFor = null;
  state.focusRootId = null;
  render();
}
function centerOn(id) {
  const p = state.layout && state.layout.nodes.get(id);
  if (!p) return;
  const graph = document.getElementById('graph');
  const w = canvasWidth(), h = graph.clientHeight || 600;
  const t = state.viewport;
  const sx = t.applyX(p.x), sy = t.applyY(p.y);
  if (sx > 60 && sx < w - 60 && sy > 60 && sy < h - 60) return;
  const k = Math.max(.6, Math.min(t.k || 1, 1.4));
  svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-p.x, -p.y));
}

function paint() {
  const L = state.layout;
  if (!L) return;
  const items = [...L.nodes].map(([id, p]) => {
    const t = state.tasks.get(id);
    const report = !p.ghost && !p.temp && t ? t.report : '';
    return {
      id, x: p.x, y: p.y, r: p.r,
      ghost: !!p.ghost, temp: !!p.temp,
      title: p.ghost ? p.title : (t ? t.title : id),
      kind: p.ghost ? p.kind : (t ? t.kind : 'simple'),
      state: p.ghost ? '' : (t ? t.state : 'sleeping'),
      lines: (p.label && p.label.lines) || [p.title || ''],
      hasReport: !!report,
      fresh: report ? freshness(t) : 0,
    };
  });

  const findActive = state.find.open && state.find.query.trim() !== '';
  const currentMatch = findActive ? state.find.matches[state.find.index] : null;
  const reviewAnchor = state.situation && state.situation.type === 'review' ? state.anchorId : null;

  const nJoin = nodeL.selectAll('g.node').data(items, d => d.id);
  nJoin.exit().remove();
  const ne = nJoin.enter().append('g').attr('class', 'node');
  ne.append('circle').attr('class', 'halo');
  ne.append('circle').attr('class', 'ring2');
  ne.append('circle').attr('class', 'anchor-ring');
  ne.append('circle').attr('class', 'core');
  ne.append('circle').attr('class', 'fresh-track').attr('transform', 'rotate(-90)');
  ne.append('circle').attr('class', 'fresh-arc').attr('transform', 'rotate(-90)');
  ne.append('circle').attr('class', 'cursor-ring');
  ne.append('text').attr('class', 'label').attr('text-anchor', 'middle');
  const merged = nJoin.merge(ne);
  merged.each(function (d) {

    const env = await submitRoot(t.title, new AbortController().signal);
    state.run = { id: null, pending: false, error: null };
    applyEnvelope(env);
    refresh();
  } catch (e) {
    state.run = { id, pending: false, error: String(e) };
    renderReader();
  }
}

async function submitRoot(instr, sig) {
  const res = await fetch(TASKS_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ task: instr }), signal: sig });
  if (!res.ok) throw new Error(String(res.status));
  return res.json();
}
async function postReview(body) {
  const controller = new AbortController();
  const res = await fetch(REVIEW_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: controller.signal });
  if (!res.ok) throw new Error(String(res.status));
}
async function resolveSituation(body) {
  if (!state.situation || state.situationStatus !== 'idle' || state.error) return;
  const type = state.situation.type;
  state.situationStatus = 'sending';
  state.reviewError = null;
  renderComposer();
  try {
    await postReview(body);
    const reviewType = type === 'task-proposal' || type === 'tool-approval' || type === 'review';
    if (reviewType && !('review' in body)) state.situationStatus = 'settled';
    else state.situationStatus = 'awaiting';
    render();
  } catch (e) {
    state.situationStatus = 'idle';
    state.reviewError = String(e);
    render();
  }
}

function recomputeFind(resetIndex) {
  const q = state.find.query.trim().toLowerCase();
  if (!q) { state.find.matches = []; state.find.index = 0; return; }
  state.find.matches = [...state.tasks.values()]
    .filter(t => `${t.title} ${t.instruction} ${t.report || ''}`.toLowerCase().includes(q))
    .map(t => t.id);
  if (resetIndex || state.find.index >= state.find.matches.length) state.find.index = 0;
}
function goToMatch(dir) {
  const m = state.find.matches;
  if (!m.length) { paint(); return; }
  state.find.index = (state.find.index + dir + m.length) % m.length;
  const id = m[state.find.index];
  const root = rootOwning(id);
  if (root && !state.find.open) state.focusRootId = root;
  const relaid = render();
  if (!relaid) centerOn(id);
  paintFind();
}
function currentMatchId() {
  return state.find.matches[state.find.index] || null;
}

document.getElementById('brand').onclick = clearSelection;
const composerInput = document.getElementById('composer-input');
composerInput.addEventListener('input', e => {
  if (baseComposerMode() === 'review') {
    state.reviewDraft = e.target.value;
    state.reviewError = null;
  } else {
    state.taskDraft = e.target.value;
    state.submitError = null;
  }
  growComposer(e.target);
  renderComposer();
});
composerInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  e.preventDefault();
  composerSubmit();
});
document.getElementById('composer-primary').onclick = composerPrimary;
document.getElementById('composer-retry').onclick = refresh;

function composerSubmit() {
  if (state.actionLock) return;
  const base = baseComposerMode();
  if (base === 'new') return submitTask();
  if (base === 'review') return sendReviewText();
}
function composerPrimary() {
  if (state.actionLock) return;
  const base = baseComposerMode();
  if (base === 'new') return submitTask();
  if (base === 'review') {
    const s = state.situation;
    if (!s || s.unsupported) return;
    if (s.type === 'question') return sendReviewText();
    if (state.reviewDraft.trim()) return sendReviewText();
    return approveSituation();
  }
}
function sendReviewText() {
  const text = state.reviewDraft.trim();
  if (!text || !canReview()) return;
  resolveSituation({ review: text });
}
function approveSituation() {
  const s = state.situation;
  if (!s || s.unsupported || !canReview()) return;
  if (s.type !== 'task-proposal' && s.type !== 'tool-approval' && s.type !== 'review') return;
  resolveSituation({});
}
async function submitTask() {
  const instr = state.taskDraft.trim();
  if (!instr || baseComposerMode() !== 'new' || state.submitting || state.error) return;
  state.submitting = true;
  state.submitError = null;
  state.tempRoot = { label: 'submitting…' };
  state.tempBaseline = new Set(getRoots().map(r => r.id));
  state.focusRootId = null;
  state.selectedId = null;
  render();
  try {
    const env = await submitRoot(instr, new AbortController().signal);
    state.taskDraft = '';
    state.submitting = false;
    applyEnvelope(env);
    refresh();
  } catch (e) {
    state.submitting = false;
    state.tempRoot = null;
    state.submitError = String(e);
    render();
  }
}

function openFind() {
  if (!state.find.open) state.find.returnFocus = state.focusRootId;
  document.getElementById('findbar').classList.remove('hidden');
  state.find.open = true;
  document.getElementById('find-input').focus();
  render();
}
function closeFind() {
  document.getElementById('findbar').classList.add('hidden');
  const input = document.getElementById('find-input');
  input.value = '';
  input.blur();
  const back = state.find.returnFocus;
  state.find = { open: false, query: '', matches: [], index: 0, returnFocus: null };
  state.focusRootId = back && state.tasks.has(back) ? back : null;
  render();
}
document.getElementById('find-close').onclick = closeFind;
document.getElementById('find-input').addEventListener('input', e => {
  state.find.query = e.target.value;
  recomputeFind(true);
  render();
});
document.getElementById('find-input').addEventListener('keydown', e => {
  const has = state.find.matches.length > 0;
  if (e.key === 'Enter') {
    e.preventDefault();
    const id = currentMatchId();
    if (id) selectNode(id, true);
    return;
  }
  if (!has) return;
  if (e.key === 'Tab') { e.preventDefault(); goToMatch(e.shiftKey ? -1 : 1); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); goToMatch(1); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); goToMatch(-1); }
});
document.getElementById('find-prev').onclick = () => goToMatch(-1);
document.getElementById('find-next').onclick = () => goToMatch(1);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(); return; }
  if (e.key === 'Escape') {
    if (state.find.open && readerVisible()) { closeReader(); return; }
    if (state.find.open) { closeFind(); return; }
    if (readerVisible()) { closeReader(); return; }
    return;
  }
  const a = document.activeElement, tag = a && a.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || (a && a.isContentEditable);
  if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (typing) return;
    e.preventDefault();
    openFind();
    return;
  }
  if (e.key === 'Enter' && state.selectedId && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (typing || tag === 'BUTTON' || tag === 'A') return;
    if (e.target.closest && e.target.closest('#drawer')) return;
    if (readerVisible()) return;
    e.preventDefault();
    state.readerDismissedFor = null;
    render();
    const body = document.querySelector('#detail .detail-body');
    if (body) body.focus({ preventScroll: true });
  }
});

/* ---- live output stream ---- */
let streamAbort = null, streamRetryTimer = null, streamBackoff = 1000;

function currentAwakeTask() {
  for (const t of state.tasks.values()) if (t.state === 'awake') return t;
  return null;
}
function trackAwake(prevAwake) {
  const next = currentAwakeTask();
  for (const id of [...state.awakeSince.keys()]) {
    const t = state.tasks.get(id);
    if (!t || t.state !== 'awake') state.awakeSince.delete(id);
  }
  if (next) {
    if (!state.awakeSince.has(next.id)) state.awakeSince.set(next.id, Date.now());
    if (!state.envelopeSeen) state.stream.observedStart = false;
    else if (!prevAwake || prevAwake.id !== next.id) state.stream.observedStart = true;
  } else {
    state.stream.observedStart = false;
  }
  state.envelopeSeen = true;
}
function syncStream() {
  const awake = currentAwakeTask();
  if (!awake || document.hidden) {
    if (streamAbort || streamRetryTimer || state.stream.status !== 'idle') closeStream();
    return;
  }
  if (streamAbort || streamRetryTimer) return;
  connectStream();
}
function connectStream() {
  const awake = currentAwakeTask();
  if (!awake || document.hidden || streamAbort) return;
  const ctrl = new AbortController();
  streamAbort = ctrl;
  const s = state.stream;
  s.status = 'connecting';
  s.task = awake.id;
  s.startedAt = state.awakeSince.get(awake.id) || Date.now();
  s.lastChunkAt = null;
  s.lastPingAt = null;
  s.raw = '';
  s.chunkTimes = [];
  s.rate = 0;
  s.midTask = !s.observedStart;
  s.toolOnly = false;
  s.lastText = '';
  s.lastTextAt = 0;
  s.rendered = '';
  s.headerAt = 0;
  runStream(ctrl);
}
async function runStream(ctrl) {
  const s = state.stream;
  try {
    const res = await fetch(STREAM_URL, {
      signal: ctrl.signal,
      headers: { accept: 'text/event-stream' },
      cache: 'no-store',
    });
    if (ctrl.signal.aborted) return;
    if (res.status === 404) {
      s.status = currentAwakeTask() ? 'ended' : 'idle';
      if (streamAbort === ctrl) streamAbort = null;
      scheduleStreamRetry(2000);
      return;
    }
    if (!res.ok || !res.body) throw new Error(String(res.status));
    s.status = 'open';
    streamBackoff = 1000;
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        handleFrame(buf.slice(0, idx));
        buf = buf.slice(idx + 2);
      }
    }
    if (!ctrl.signal.aborted) onStreamEnd();
  } catch (e) {
    if (!ctrl.signal.aborted) onStreamEnd();
  } finally {
    if (streamAbort === ctrl) streamAbort = null;
  }
}
function decodeChunk(text) {
  let current = String(text);
  for (let i = 0; i < 2; i++) {
    const t = current.trim();
    if (!(t.length >= 2 && t.startsWith('"') && t.endsWith('"'))) break;
    try {
      const parsed = JSON.parse(t);
      if (typeof parsed !== 'string') break;
      current = parsed;
    } catch (e) {
      break;
    }
  }
  return current;
}
function displayText(text) {
  if (!text.includes('\\')) return text;
  return text
    .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)))
    .replace(/\\n/g, '\n')
    .replace(/\\r/g, '')
    .replace(/\\t/g, '\t')
    .replace(/\\"/g, '"');
}
function handleFrame(frame) {
  let event = '';
  const data = [];
  for (const line of frame.split('\n')) {
    if (!line) continue;
    if (line.startsWith(':')) { state.stream.lastPingAt = Date.now(); continue; }
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
  }
  if (event && data.length) onChunk(event, decodeChunk(data.join('\n')));
}
function onChunk(task, text) {
  const s = state.stream;
  const now = Date.now();
  if (s.task && s.task !== task) {
    s.task = task;
    s.raw = '';
    s.rendered = '';
    s.lastText = '';
    s.lastTextAt = 0;
    s.startedAt = state.awakeSince.get(task) || now;
    s.midTask = true;
    s.toolOnly = false;
    s.headerAt = 0;
    streamRefreshSoon();
  }
  s.lastChunkAt = now;
  if (!s.chunkTimes.length) s.headerAt = 0;
  s.chunkTimes.push(now);
  s.raw += text;
  if (s.raw.length > STREAM_MAX_CHARS) s.raw = s.raw.slice(s.raw.length - STREAM_MAX_CHARS);
}
function streamRefreshSoon() {
  const now = Date.now();
  if (now - state.stream.lastRefreshAt < 600) return;
  state.stream.lastRefreshAt = now;
  refresh();
}
function onStreamEnd() {
  const s = state.stream;
  if (s.status === 'idle') return;
  s.status = 'ended';
  s.rate = 0;
  s.observedStart = false;
  scheduleStreamRetry();
  streamRefreshSoon();
}
function scheduleStreamRetry(delay) {
  if (streamRetryTimer) return;
  const wait = delay != null ? delay : streamBackoff;
  streamBackoff = Math.min(streamBackoff * 2, 10000);
  streamRetryTimer = setTimeout(() => {
    streamRetryTimer = null;
    if (currentAwakeTask() && !document.hidden) connectStream();
    else closeStream();
  }, wait);
}
function closeStream() {
  if (streamAbort) { const a = streamAbort; streamAbort = null; a.abort(); }
  if (streamRetryTimer) { clearTimeout(streamRetryTimer); streamRetryTimer = null; }
  const s = state.stream;
  s.status = 'idle';
  s.task = null;
  s.raw = '';
  s.chunkTimes = [];
  s.rate = 0;
  s.midTask = false;
  s.toolOnly = false;
  s.lastText = '';
  s.lastTextAt = 0;
  s.rendered = '';
  s.lastChunkAt = null;
  s.lastPingAt = null;
  s.headerAt = 0;
  updateNodeActivity(0);
  tickLive();
}
function filterTail(raw) {
  const slice = raw.slice(Math.max(0, raw.length - STREAM_WINDOW_CHARS)).replace(/\r/g, '');
  const kept = [];
  let droppedAfter = false;
  for (const line of slice.split('\n')) {
    const t = line.trim();
    if (!t) continue;
    if (t.startsWith('```')) { if (kept.length) droppedAfter = true; continue; }
    const density = (t.match(/[{}\[\]"`]/g) || []).length / t.length;
    if (density > 0.2) { if (kept.length) droppedAfter = true; continue; }
    const prose = t.replace(/^[#>*\-\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
    if (prose) { kept.push(prose); droppedAfter = false; }
  }
  return { text: kept.slice(-STREAM_TAIL_LINES).join('\n'), droppedAfter };
}
function fmtDuration(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function liveStatusKey(s, age) {
  if (s.status === 'connecting') return 'connecting';
  if (s.status === 'ended') return 'ended';
  if (s.status !== 'open') return 'idle';
  if (age == null) return 'waiting';
  if (age * 1000 < STREAM_QUIET_MS) return 'streaming';
  if (age * 1000 < STREAM_STALL_MS) return 'quiet';
  return 'stalled';
}
function updateNodeActivity(level) {
  const s = state.stream;
  nodeL.selectAll('g.node.state-awake').each(function (d) {
    const on = s.status === 'open' && s.task === d.id;
    const sel = d3.select(this);
    sel.classed('live', on);
    if (on) sel.style('--activity', String(level));
    else sel.style('--activity', null);
  });
}
function tickLive() {
  const s = state.stream;
  const live = document.getElementById('live');
  const busy = baseComposerMode() === 'busy';
  const active = s.status === 'open' || s.status === 'connecting' || s.status === 'ended';
  const show = busy && active && !!s.task;
  live.classList.toggle('hidden', !show);
  if (!show) { updateNodeActivity(0); return; }

  const now = Date.now();
  s.chunkTimes = s.chunkTimes.filter(t => now - t < 3000);
  const instant = s.chunkTimes.filter(t => now - t < 1000).length;
  s.rate = s.rate * 0.7 + instant * 0.3;
  updateNodeActivity(s.status === 'open' ? Math.min(1, s.rate / 8) : 0);

  const tail = filterTail(displayText(s.raw));
  if (tail.text) { s.lastText = tail.text; s.lastTextAt = now; }
  s.toolOnly = tail.droppedAfter;
  const display = (s.midTask ? '… ' : '') + (s.lastText || 'waiting for output…');
  if (display !== s.rendered) {
    document.getElementById('live-text').textContent = display;
    s.rendered = display;
    const box = document.getElementById('live-tail');
    box.scrollTop = box.scrollHeight;
  }

  const age = s.lastChunkAt ? (now - s.lastChunkAt) / 1000 : null;
  const key = liveStatusKey(s, age);
  document.getElementById('live-caret').classList.toggle('quiet', key !== 'streaming');

  if (now - s.headerAt >= 900) {
    s.headerAt = now;
    const labels = {
      connecting: 'connecting…',
      ended: 'stream ended · polling',
      waiting: 'waiting for output',
      streaming: 'streaming',
      quiet: 'quiet',
      stalled: `no output for ${Math.floor(age || 0)}s`,
    };
    const elapsed = fmtDuration(now - (state.awakeSince.get(s.task) || s.startedAt || now));
    document.getElementById('live-task').textContent = (s.midTask ? '… ' : '') + (s.task || '');
    const meta = document.getElementById('live-meta');
    meta.dataset.status = key;
    const bits = [labels[key] || ''];
    if (s.toolOnly) bits.push('tool output');
    bits.push(elapsed);
    if (age != null && key !== 'stalled') bits.push(`last ${Math.max(0, Math.floor(age))}s`);
    meta.textContent = bits.filter(Boolean).join(' · ');
  }
}

let pab = null, pt = null;
async function getTasks(sig) {
  const res = await fetch(TASKS_URL, { signal: sig, headers: { accept: 'application/json' }, cache: 'no-store' });
  if (!res.ok) throw new Error(String(res.status));
  return res.json();
}
async function refresh() {
  if (pab) pab.abort();
  pab = new AbortController();
  try {
    const env = await getTasks(pab.signal);
    if (pab.signal.aborted) return;
    state.error = null;
    applyEnvelope(env);
  } catch (e) {
    if (e.name === 'AbortError') return;
    state.error = String(e);
    paintTop();
    renderComposer();
  }
}
function poll() {
  if (!document.hidden) refresh();
  pt = setTimeout(poll, POLL_INTERVAL);
}
let stageHeight = 0, resizeTimer = null;
const stageObserver = new ResizeObserver(entries => {
  const h = entries[0].contentRect.height;
  if (!stageHeight) { stageHeight = h; return; }
  if (Math.abs(h - stageHeight) < 80) return;
  stageHeight = h;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state.layout && state.layout.bounds) fit(); }, 150);
});
stageObserver.observe(document.getElementById('stage'));

document.addEventListener('visibilitychange', () => {
  if (document.hidden) closeStream();
  else refresh();
});
window.addEventListener('pagehide', () => closeStream());
setInterval(tickLive, 100);

render();
refresh();
poll();
</script>
