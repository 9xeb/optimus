<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Optimus Console</title>
<style>
  :root {
    --bg: #070b12; --bg-2: #0a0f18; --panel: #0e1522; --panel-2: #131c2c;
    --border: #22304a; --border-2: #2c3d5c;
    --text: #c9d4e6; --text-dim: #6d7f9b; --text-faint: #46566f;
    --accent: #35d0ff; --awake: #35d0ff; --sleeping: #3d4f6b;
    --failing: #ff4d5e; --ok: #34d399; --warn: #fbbf24; --match: #ffd166;
    --cursor: #ff4dd8;
    --action: #a78bfa; --question: #5fa8ff; --review: #34d399;
    --shadow: 0 10px 40px rgba(0,0,0,.5);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(1200px 700px at 78% -10%, rgba(53,208,255,.10), transparent 60%), radial-gradient(900px 600px at -5% 105%, rgba(167,139,250,.08), transparent 55%), var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #topbar { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: linear-gradient(180deg, rgba(19,28,44,.92), rgba(14,21,34,.78)); border-bottom: 1px solid var(--border); backdrop-filter: blur(8px); z-index: 20; flex: 0 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 0 0 auto; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: radial-gradient(circle at 30% 30%, #6fe6ff, #1aa7d6 60%, #0b4f6b); box-shadow: 0 0 18px rgba(53,208,255,.45), inset 0 0 10px rgba(255,255,255,.3); }
  .brand h1 { margin: 0; font-size: 13px; letter-spacing: .2em; font-weight: 700; }
  .topbar-main { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .root-picker { display: flex; align-items: center; min-width: 0; }
  #root-select { max-width: 250px; min-width: 110px; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: var(--mono); font-size: 11px; padding: 6px 26px 6px 9px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-faint) 50%), linear-gradient(135deg, var(--text-faint) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
  #root-select:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  #root-select:disabled { opacity: .5; }
  .unread-btn { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid rgba(53,208,255,.4); border-radius: 999px; background: rgba(53,208,255,.06); color: var(--accent); font-family: var(--mono); font-size: 10.5px; cursor: pointer; white-space: nowrap; }
  .unread-btn:hover { background: rgba(53,208,255,.13); }
  .unread-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .unread-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 7px var(--accent); }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .modes { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mode-btn { border: 0; background: transparent; color: var(--text-dim); padding: 6px 10px; font-family: var(--sans); font-size: 12px; cursor: pointer; }
  .mode-btn:hover { color: var(--text); }
  .mode-btn[aria-pressed="true"] { background: rgba(53,208,255,.12); color: var(--accent); }
  .mode-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: -2px; }
  #sandbox-open { text-decoration: none; }
  .status { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .status .led { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status.error .led { background: var(--failing); box-shadow: 0 0 8px var(--failing); }
  .status.error { color: var(--failing); }
  .btn { font-family: var(--sans); font-size: 12.5px; cursor: pointer; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text); }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--border-2); }
  .btn.primary { background: linear-gradient(180deg, #2fc4f0, #1a95c4); border-color: #2fc4f0; color: #03202b; font-weight: 650; }
  .btn.ghost { background: transparent; }
  .btn.tiny { padding: 4px 9px; border-radius: 7px; font-size: 12px; }
  .btn.danger { color: var(--failing); }
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #graph { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; display: block; }
  #graph:active { cursor: grabbing; }
  #sandbox { position: absolute; inset: 0; z-index: 25; background: var(--bg); }
  #sandbox iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }

  /* run view */
  #run { position: absolute; inset: 0; z-index: 14; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); transform: translateY(101%); transition: transform .26s cubic-bezier(.32,.72,.28,1); will-change: transform; }
  #run.open { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { #run { transition: none; } }
  #run-bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(9,14,22,.99), rgba(9,14,22,.92)); }
  #run-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  #run-close { border: 1px solid var(--border-2); border-radius: 999px; padding: 4px 12px; background: var(--panel-2); color: var(--text-dim); font-family: var(--mono); font-size: 10.5px; cursor: pointer; }
  #run-close:hover { border-color: var(--accent); color: var(--accent); }
  #run-close:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  #run-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 24px 70px; }
  #root-header { position: sticky; top: 0; z-index: 10; max-width: 880px; margin: 0 auto; padding: 22px 0 14px; background: linear-gradient(180deg, rgba(9,14,22,.97) 70%, rgba(9,14,22,.86)); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .root-head-top { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  #root-title { margin: 0; font-family: var(--mono); font-size: 19px; line-height: 1.25; font-weight: 700; color: #e6faff; overflow-wrap: anywhere; }
  .root-meta { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); white-space: nowrap; }
  .root-meta .fail { color: var(--failing); }
  .root-meta .awake { color: var(--accent); }
  #root-instruction { margin: 5px 0 9px; font-size: 12.5px; line-height: 1.45; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .root-deps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; }
  .dep-box { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 4px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel-2); color: var(--text-dim); font-family: var(--mono); font-size: 10.5px; cursor: pointer; }
  .dep-box:hover { border-color: var(--border-2); color: var(--text); }
  .dep-box:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .dep-box .dep-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sleeping); flex: 0 0 auto; }
  .dep-box.state-awake .dep-dot { background: var(--awake); box-shadow: 0 0 6px var(--awake); }
  .dep-box.state-failing .dep-dot { background: var(--failing); box-shadow: 0 0 6px var(--failing); }
  .dep-box.reported .dep-dot { background: var(--ok); }
  .dep-box.active { border-color: var(--accent); background: rgba(53,208,255,.12); color: #dff3ff; box-shadow: 0 0 0 1px rgba(53,208,255,.16); }
  .dep-box.active .dep-dot { background: var(--accent); box-shadow: 0 0 7px var(--accent); }
  .dep-box-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .root-bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--border); }
  .root-seg { display: block; height: 100%; }
  .root-seg.done { background: var(--ok); }
  .root-seg.awake { background: var(--awake); }
  .root-seg.failing { background: var(--failing); }
  .root-seg.pending { background: var(--border-2); }
  #run-body { max-width: 880px; margin: 0 auto; padding-top: 16px; }

  /* live card */
  #live { margin: 16px 0 0; padding: 9px 12px 8px; border: 1px solid rgba(53,208,255,.32); border-radius: 10px; background: rgba(6,43,58,.34); }
  #live-head { display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); font-size: 10.5px; line-height: 1.3; color: var(--text-faint); }
  #live-task { color: #b8ecff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #live-meta { margin-left: auto; white-space: nowrap; }
  #live-meta[data-status="streaming"] { color: var(--awake); }
  #live-meta[data-status="stalled"], #live-meta[data-status="ended"] { color: var(--warn); }
  #live-tail { height: calc(3 * 1.35em); overflow: hidden; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.35; color: var(--text); }
  #live-text { white-space: pre-wrap; }
  #live-caret { color: var(--awake); margin-left: 1px; animation: livecaret 1.05s steps(1) infinite; }
  #live-caret.quiet { animation: none; opacity: .25; }
  @keyframes livecaret { 0%, 49% { opacity: .15; } 50%, 100% { opacity: 1; } }

  /* reports */
  .feed-kicker { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 2px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); }
  .root-new { display: flex; justify-content: flex-end; margin-top: 8px; }
  .root-new button { border: 1px solid rgba(53,208,255,.4); background: rgba(53,208,255,.07); color: var(--accent); border-radius: 999px; padding: 4px 11px; font-family: var(--mono); font-size: 10.5px; cursor: pointer; }
  .root-new button:hover { background: rgba(53,208,255,.14); }
  .root-new button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .report-card { position: relative; padding: 16px 0 20px; border-top: 1px solid var(--border); }
  .report-card:first-of-type { border-top: 1px solid var(--border); }
  .report-card.unread::before { content: ''; position: absolute; left: -14px; top: 19px; bottom: 20px; width: 2px; border-radius: 2px; background: var(--accent); }
  .report-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 9px; }
  .report-title { border: 0; background: none; padding: 0; color: #dff3ff; font-family: var(--mono); font-size: 13.5px; font-weight: 650; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
  .report-title:hover { color: var(--accent); }
  .report-title:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .report-time { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); white-space: nowrap; }
  .report-new { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--accent); border: 1px solid rgba(53,208,255,.5); border-radius: 999px; padding: 1px 6px; }
  .report-marker { font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-dim); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  .report-marker.failing { color: var(--failing); border-color: rgba(255,77,94,.5); }
  .report-marker.root { color: var(--accent); border-color: rgba(53,208,255,.5); }
  .report-marker.prev { color: var(--warn); border-color: rgba(251,191,36,.45); }
  .report-spacer { margin-left: auto; }
  .report-toggle { border: 0; background: none; color: var(--text-faint); font-family: var(--mono); font-size: 10.5px; cursor: pointer; padding: 2px 0; white-space: nowrap; }
  .report-toggle:hover { color: var(--text); }
  .report-toggle:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .report-body { font-size: 13px; line-height: 1.65; color: var(--text); overflow-wrap: anywhere; }
  .report-body.snippet { color: var(--text-dim); white-space: pre-wrap; }
  .report-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .report-actions .btn { padding: 3px 9px; font-size: 11px; }
  .failure-row { display: flex; align-items: baseline; gap: 9px; padding: 12px 0; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 12px; color: #ffc0c6; }
  .failure-row .task { color: #ffd7db; font-weight: 650; }
  .run-empty { padding: 46px 16px 30px; text-align: center; color: var(--text-dim); }
  .run-empty h2 { margin: 0 0 7px; font-size: 16px; color: var(--text); }
  .run-empty p { margin: 0; font-size: 12.5px; }

  /* task details */
  .task-details { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; background: rgba(14,21,34,.55); padding: 12px 14px; }
  .task-details .detail-title { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .task-details .name { font-family: var(--mono); font-size: 13.5px; font-weight: 650; color: #dff3ff; overflow-wrap: anywhere; }
  .details-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px 14px; margin: 12px 0; }
  .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .meta .k { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  .meta .v { font-size: 11.5px; font-family: var(--mono); color: var(--text); overflow-wrap: anywhere; }
  .section { margin-top: 14px; }
  .section > h3 { font-size: 9.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-faint); margin: 0 0 7px; font-weight: 600; }
  .instruction { font-size: 12.5px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .dep-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .dep { font-family: var(--mono); font-size: 11px; cursor: pointer; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim); }
  .dep:hover { border-color: var(--accent); color: var(--text); }
  .dep.unresolved { border-style: dashed; color: var(--text-faint); cursor: default; }
  .empty-note { font-size: 12px; color: var(--text-faint); font-style: italic; }
  .detail-run { color: var(--awake); border-color: rgba(53,208,255,.45); }
  .detail-run:disabled { color: var(--text-faint); border-color: var(--border); cursor: default; }
  .detail-run:disabled:hover { border-color: var(--border); }
  .run-note { margin: 0 0 10px; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border); background: rgba(7,11,18,.5); font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .run-note.error { border-color: rgba(255,77,94,.45); color: #ffc0c6; }

  /* root list */
  .root-list { display: flex; flex-direction: column; gap: 9px; padding-top: 8px; }
  .root-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: start; width: 100%; text-align: left; padding: 15px 14px; border: 1px solid var(--border); border-radius: 12px; background: rgba(14,21,34,.45); color: var(--text); cursor: pointer; }
  .root-row:hover { border-color: var(--accent); background: rgba(14,21,34,.7); }
  .root-row.temp { cursor: default; opacity: .75; }
  .root-row.temp:hover { border-color: var(--border); background: rgba(14,21,34,.45); }
  .root-row:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .root-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; background: var(--sleeping); }
  .root-dot.awake { background: var(--awake); box-shadow: 0 0 8px var(--awake); }
  .root-dot.failing { background: var(--failing); box-shadow: 0 0 8px var(--failing); }
  .root-dot.reported { background: var(--ok); }
  .root-row .r-title { display: block; font-family: var(--mono); font-size: 13.5px; font-weight: 650; color: #dff3ff; overflow-wrap: anywhere; }
  .root-row .r-sub { display: block; margin-top: 3px; font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .root-row .r-meta { font-family: var(--mono); font-size: 10px; color: var(--text-faint); text-align: right; white-space: nowrap; }
  .root-row .r-meta-line { display: block; }
  .root-row .r-unread { display: block; margin-top: 4px; font-family: var(--mono); font-size: 9px; color: var(--accent); }

  /* graph */
  .edge { fill: none; stroke: #2a3a55; stroke-width: 1.5; }
  .edge.unresolved { stroke: #4a3a5c; stroke-dasharray: 4 5; }
  .edge.proposal { stroke: #4a3a5c; stroke-dasharray: 4 5; }
  .edge.awake { stroke: var(--awake); stroke-width: 2.1; stroke-dasharray: 5 13; animation: dashflow 1s linear infinite; }
  .edge.match { stroke: var(--match); }
  @keyframes dashflow { to { stroke-dashoffset: -18; } }
  .node { cursor: pointer; }
  .node .core { stroke-width: 1.7; }
  .node .ring2 { fill: none; }
  .node .halo { pointer-events: none; }
  .node .anchor-ring { display: none; fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 5 4; opacity: .9; pointer-events: none; }
  .node.anchor .anchor-ring { display: block; }
  .node .report-dot { fill: var(--ok); pointer-events: none; }
  .node .label { font-family: var(--mono); font-size: 11px; fill: var(--text-dim); pointer-events: auto; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .node.state-sleeping .core { fill: #131c2b; stroke: var(--sleeping); }
  .node.state-sleeping .label { fill: var(--text-faint); }
  .node.state-awake .core { fill: #062b3a; stroke: var(--awake); }
  .node.state-awake .halo { fill: var(--awake); opacity: .12; animation: breathe 1.7s ease-in-out infinite; }
  .node.state-awake.live .halo { animation: none; opacity: calc(.10 + var(--activity, 0) * .40); transition: opacity .18s linear; }
  .node.state-awake .label { fill: #b8ecff; }
  .node.state-failing .core { fill: #2a0b12; stroke: var(--failing); }
  .node.state-failing .halo { fill: var(--failing); opacity: .16; animation: breathe 1.05s ease-in-out infinite; }
  .node.state-failing .label { fill: #ffc0c6; }
  .node.review .anchor-ring { display: block; stroke-dasharray: none; stroke-width: 2.6; opacity: 1; filter: drop-shadow(0 0 6px rgba(251,191,36,.5)); }
  .node.review .halo { display: block; fill: var(--warn); opacity: .10; animation: reviewpulse 2.6s ease-in-out infinite; }
  @keyframes reviewpulse { 0%, 100% { opacity: .08; } 50% { opacity: .26; } }
  @keyframes breathe { 0%,100% { opacity: .10; } 50% { opacity: .30; } }
  .node.kind-simple .ring2 { display: none; }
  .node.kind-complex .core { stroke-width: 2.4; }
  .node.kind-complex .ring2 { display: block; stroke: var(--border-2); stroke-dasharray: 3 4; opacity: .8; }
  .node.kind-root .core { stroke-width: 3.2; }
  .node.kind-root .ring2 { display: block; stroke: var(--accent); stroke-width: 1.6; opacity: .9; }
  .node.kind-root .label { font-weight: 700; font-size: 12px; fill: #e6faff; }
  .node.proposal .core { fill: rgba(251,191,36,.06); stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.8; }
  .node.proposal .ring2, .node.proposal .halo, .node.proposal .report-dot { display: none; }
  .node.proposal .label { fill: var(--warn); opacity: .85; font-size: 10.5px; }
  .node.temp .core { fill: #0e1522; stroke: var(--text-faint); stroke-dasharray: 4 5; }
  .node.temp .ring2, .node.temp .halo, .node.temp .report-dot { display: none; }
  .node.temp .label { fill: var(--text-faint); }
  .node:focus-visible .core { filter: drop-shadow(0 0 6px var(--accent)); }
  .node:focus-visible .label { fill: #dff3ff; }
  .node .cursor-ring { display: none; fill: none; stroke: var(--cursor); stroke-width: 4; pointer-events: none; filter: drop-shadow(0 0 8px rgba(255,77,216,.95)); }
  .node.match-current .cursor-ring { display: block; animation: cursorpulse 1.1s ease-in-out infinite; }
  .node.match-current .core { stroke: var(--cursor) !important; stroke-width: 3.6; }
  .node.match-current .halo { fill: var(--cursor); animation: cursorpulse 1.1s ease-in-out infinite; }
  .node.match-current .label { fill: #ffd6fb; }
  @keyframes cursorpulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  #graph.find-active .node:not(.match) { opacity: .13; }
  #graph.find-active .edge:not(.match) { opacity: .06; }
  #findbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; z-index: 16; background: rgba(14,21,34,.95); border: 1px solid var(--border-2); padding: 6px 8px; border-radius: 10px; box-shadow: var(--shadow); }
  #findbar.hidden { display: none; }

  .report-md pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; margin: 0 0 10px; }

<body>

        </header>

</div>
<script type="module">
import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';
import dagre from 'https://cdn.jsdelivr.net/npm/@dagrejs/dagre@1/+esm';
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@13/+esm';
import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3/+esm';

const TASKS_URL = '/tasks', REVIEW_URL = '/review', POLL_INTERVAL = 2000, DEFAULT_TTL = 60;
const SANDBOX_URL = `http://${location.hostname || '127.0.0.1'}:8080/`;
const STREAM_URL = '/tasks/stream';
const STREAM_QUIET_MS = 2000, STREAM_STALL_MS = 15000;
const STREAM_MAX_CHARS = 64 * 1024, STREAM_WINDOW_CHARS = 2000, STREAM_TAIL_LINES = 6;
const LABEL_MAX_CHARS = 22, LABEL_CHAR_W = 6.6, LABEL_LINE_H = 13, LABEL_GAP = 16;
const EVENT_LABELS = { 'task-proposal': 'TASK', 'tool-approval': 'ACTION', 'question': 'QUESTION', 'review': 'REVIEW' };
const EVENT_CLASSES = { 'task-proposal': 'event-task', 'tool-approval': 'event-action', 'question': 'event-question', 'review': 'event-review' };

const state = {
  tasks: new Map(),
  mode: 'map',
  activeRootId: null,
  rootPinned: true,
  anchorId: null,
  tempRoot: null,
  tempBaseline: null,
  sandboxReturn: 'map',
  situation: null,
  situationSig: null,
  situationStatus: 'idle',
  taskDraft: '',
  reviewDraft: '',
  submitError: null,
  reviewError: null,
  composerMode: null,
  suggestOpen: false,
  suggestIndex: -1,
  suggestItems: [],
  suggestRenderSig: null,
  suggestScrolledIndex: -2,
  suggestDismissed: false,
  actionLock: false,
  actionLockTimer: null,
  layout: null,
  signature: null,
  viewport: d3.zoomIdentity,
  run: { id: null, pending: false, error: null },
  stream: {
    status: 'idle',
    task: null,
    startedAt: null,
    lastChunkAt: null,
    lastPingAt: null,
    raw: '',
    chunkTimes: [],
    rate: 0,
    midTask: false,
    toolOnly: false,
    lastText: '',
    lastTextAt: 0,
    rendered: '',
    headerAt: 0,
    observedStart: false,
    lastRefreshAt: 0,
  },
  awakeSince: new Map(),
  envelopeSeen: false,
  reportsSeeded: false,
  seenAt: new Map(),
  unread: new Map(),
  expandedReports: new Set(),
  detailsTaskId: null,
  feedReset: false,
  followBottom: false,
  reportSig: null,
  rootListSig: null,
  rootDepsSig: null,
  find: { open: false, query: '', matches: [], index: 0, returnMode: 'run', returnRoot: null },
  error: null,
};

function el(t, p = {}, c = []) {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(p)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v != null) n.setAttribute(k, v);
  }
  for (const x of [].concat(c)) {
    if (x == null) continue;
    n.append(typeof x === 'string' ? document.createTextNode(x) : x);
  }
  return n;
}

function normKind(k) { return k === 'root' ? 'root' : (k === 'complex' ? 'complex' : 'simple'); }
function normState(s) { return s === 'awake' ? 'awake' : (s === 'failing' ? 'failing' : 'sleeping'); }
function nodeRadius(t) { return t && t.kind === 'root' ? 26 : (t && t.kind === 'complex' ? 26 : 18); }
function ghostId(title) { return '__sit__:' + title; }

function relTime(ts) {
  const at = Date.parse(ts);
  if (!isFinite(at)) return '—';
  const m = Math.max(0, Math.round((Date.now() - at) / 60000));
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m ago`;
}
function wrapTitle(title, maxChars = LABEL_MAX_CHARS) {
  const words = String(title || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  const push = s => { if (s) lines.push(s); };
  for (let word of words) {
    while (word.length > maxChars) {
      if (line) { push(line); line = ''; }
      push(word.slice(0, maxChars));
      word = word.slice(maxChars);
    }
    if (!word) continue;
    const next = line ? `${line} ${word}` : word;
    if (line && next.length > maxChars) { push(line); line = word; }
    else line = next;
  }
  push(line);
  if (!lines.length) lines.push('');
  return lines;
}
function labelMetrics(title) {
  const lines = wrapTitle(title);
  const width = Math.max(1, ...lines.map(l => l.length)) * LABEL_CHAR_W;
  return { lines, width, height: lines.length * LABEL_LINE_H };
}
function reportStatus(t) {
  if (t.state === 'failing') return { label: 'failing', cls: 'state-failing' };
  if (t.state === 'awake') return { label: 'working', cls: 'state-awake' };
  if (t.report) return { label: 'complete', cls: 'state-complete' };
  return { label: 'not yet run', cls: 'state-idle' };
}
function canRunTask(t) {
  return !!t
    && t.state !== 'awake'
    && awakeCount() === 0
    && !state.situation
    && !state.submitting
    && !state.run.pending
    && !state.error;
}
function runBlockedReason(t) {
  if (!t) return '';
  if (t.state === 'awake') return 'Task is already running';
  if (awakeCount() > 0) return 'Another task is running';
  if (state.situation) return 'Resolve the current situation first';
  if (state.submitting) return 'A task submission is in flight';
  if (state.run.pending) return 'Starting…';
  if (state.error) return 'Backend unreachable';
  return 'Run this task now';
}

function normalizeSituation(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  const type = typeof raw.type === 'string' ? raw.type : '';
  if (!type) return null;
  const parent = raw.parent != null && String(raw.parent).trim() ? String(raw.parent) : null;
  if (type === 'question') {
    if (raw.question == null || !String(raw.question).trim()) return null;
    return { type, parent, question: String(raw.question) };
  }
  if (type === 'task-proposal') {
    const list = Array.isArray(raw.tasks) ? raw.tasks : [];
    const tasks = list.map(t => ({
      title: String(t.title || t.id || ''),
      task: String(t.task || t.instruction || ''),
      kind: normKind(t.kind),
      dependencies: Array.isArray(t.dependencies) ? t.dependencies.map(String) : [],
      ttl: Number(t.ttl) > 0 ? Number(t.ttl) : DEFAULT_TTL,
    })).filter(t => t.title);
    if (!tasks.length) return null;
    return { type, parent, tasks };
  }
  if (type === 'tool-approval') {
    const tool = raw.tool != null ? String(raw.tool).trim() : '';
    if (!tool) return { type, parent, unsupported: true };
    const args = raw.args == null ? {} : raw.args;
    const justification = raw.justification == null ? '' : String(raw.justification).trim();
    return { type, parent, tool, args, justification };
  }
  if (type === 'review') {
    const task = raw.task != null && String(raw.task).trim() ? String(raw.task) : null;
    return { type, parent: task };
  }
  return { type, parent, unsupported: true };
}
function situationSignature(s) { return s ? JSON.stringify(s) : null; }

function applyTasks(raw) {
  const arr = Array.isArray(raw)
    ? raw
    : (raw && typeof raw === 'object' ? Object.entries(raw).map(([k, v]) => ({ title: k, ...(v || {}) })) : []);
  const map = new Map();
  for (const t of arr) {
    const id = t.title || t.id || t.name;
    if (!id) continue;
    map.set(id, {
      id,
      title: id,
      instruction: t.task || t.instruction || '',
      deps: Array.isArray(t.dependencies) ? t.dependencies.map(String) : [],
      kind: normKind(t.kind),
      state: normState(t.state),
      ttl: Number(t.ttl) > 0 ? Number(t.ttl) : DEFAULT_TTL,
      report: t.report || '',
      reportAt: t.timestamp || t.reportAt || null,
    });
  }
  return map;
}

function getRoots() { return [...state.tasks.values()].filter(t => t.kind === 'root'); }
function getClosure(rid) {

    for (const t of real) { for (const d of t.deps) { if (cl.has(d) && state.tasks.has(d)) gg.setEdge(d, t.id); } }

    }

document.getElementById('brand').onclick = goHome;
document.getElementById('brand').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); }
});
function openFind() {
  if (state.mode === 'sandbox') return;
  if (state.find.open) { document.getElementById('find-input').focus(); return; }
  state.find.returnMode = state.mode;
  state.find.returnRoot = state.activeRootId;
  state.mode = 'map';
  state.find.open = true;
  state.find.query = '';
  document.getElementById('find-input').value = '';
  document.getElementById('findbar').classList.remove('hidden');
  render();
  document.getElementById('find-input').focus();
}
function closeFind(restore = true) {
  document.getElementById('findbar').classList.add('hidden');
  const input = document.getElementById('find-input');
  input.value = '';
  input.blur();
  const backMode = state.find.returnMode;
  const backRoot = state.find.returnRoot;
  state.find = { open: false, query: '', matches: [], index: 0, returnMode: 'run', returnRoot: null };
  if (!restore) return;
  state.mode = backMode === 'map' ? 'map' : 'run';
  if (!state.situation && backRoot && state.tasks.has(backRoot)) state.activeRootId = backRoot;
  render();
}
document.getElementById('find-close').onclick = () => closeFind();
document.getElementById('find-input').addEventListener('input', e => {
  state.find.query = e.target.value;
  recomputeFind(true);
  render();
});
document.getElementById('find-input').addEventListener('keydown', e => {
  const has = state.find.matches.length > 0;
  if (e.key === 'Enter') {
    e.preventDefault();
    const id = currentMatchId();
    if (id) activateTask(id);
    return;
  }
  if (!has) return;
  if (e.key === 'Tab') { e.preventDefault(); goToMatch(e.shiftKey ? -1 : 1); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); goToMatch(1); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); goToMatch(-1); }
});
document.getElementById('find-prev').onclick = () => goToMatch(-1);
document.getElementById('find-next').onclick = () => goToMatch(1);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
    if (state.mode === 'sandbox') return;
    e.preventDefault();
    openFind();
    return;
  }
  if (e.key === 'Escape') {
    if (state.find.open) { closeFind(); return; }
    if (state.mode === 'run') { setMode('map'); return; }
    if (state.mode === 'sandbox') { setMode(state.sandboxReturn || 'map'); return; }
    return;
  }
  const a = document.activeElement, tag = a && a.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || (a && a.isContentEditable);
  if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey) {

    e.preventDefault();

  }
});
/* ---- live output stream ---- */
let streamAbort = null, streamRetryTimer = null, streamBackoff = 1000;

function currentAwakeTask() {
  for (const t of state.tasks.values()) if (t.state === 'awake') return t;
  return null;
}
function trackAwake(prevAwake) {
  const next = currentAwakeTask();
  for (const id of [...state.awakeSince.keys()]) {
    const t = state.tasks.get(id);
    if (!t || t.state !== 'awake') state.awakeSince.delete(id);
  }
  if (next) {
    if (!state.awakeSince.has(next.id)) state.awakeSince.set(next.id, Date.now());
    if (!state.envelopeSeen) state.stream.observedStart = false;
    else if (!prevAwake || prevAwake.id !== next.id) state.stream.observedStart = true;
  } else {
    state.stream.observedStart = false;
  }
  state.envelopeSeen = true;
}
function syncStream() {
  const awake = currentAwakeTask();
  if (!awake || document.hidden) {
    if (streamAbort || streamRetryTimer || state.stream.status !== 'idle') closeStream();
    return;
  }
  if (streamAbort || streamRetryTimer) return;
  connectStream();
}
function connectStream() {
  const awake = currentAwakeTask();
  if (!awake || document.hidden || streamAbort) return;
  const ctrl = new AbortController();
  streamAbort = ctrl;
  const s = state.stream;
  s.status = 'connecting';
  s.task = awake.id;
  s.startedAt = state.awakeSince.get(awake.id) || Date.now();
  s.lastChunkAt = null;
  s.lastPingAt = null;
  s.raw = '';
  s.chunkTimes = [];
  s.rate = 0;
  s.midTask = !s.observedStart;
  s.toolOnly = false;
  s.lastText = '';
  s.lastTextAt = 0;
  s.rendered = '';
  s.headerAt = 0;
  runStream(ctrl);
}
async function runStream(ctrl) {
  const s = state.stream;
  try {
    const res = await fetch(STREAM_URL, {
      signal: ctrl.signal,
      headers: { accept: 'text/event-stream' },
      cache: 'no-store',
    });
    if (ctrl.signal.aborted) return;
    if (res.status === 404) {
      s.status = currentAwakeTask() ? 'ended' : 'idle';
      if (streamAbort === ctrl) streamAbort = null;
      scheduleStreamRetry(2000);
      return;
    }
    if (!res.ok || !res.body) throw new Error(String(res.status));
    s.status = 'open';
    streamBackoff = 1000;
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        handleFrame(buf.slice(0, idx));
        buf = buf.slice(idx + 2);
      }
    }
    if (!ctrl.signal.aborted) onStreamEnd();
  } catch (e) {
    if (!ctrl.signal.aborted) onStreamEnd();
  } finally {
    if (streamAbort === ctrl) streamAbort = null;
  }
}
function decodeChunk(text) {
  let current = String(text);
  for (let i = 0; i < 2; i++) {
    const t = current.trim();
    if (!(t.length >= 2 && t.startsWith('"') && t.endsWith('"'))) break;
    try {
      const parsed = JSON.parse(t);
      if (typeof parsed !== 'string') break;
      current = parsed;
    } catch (e) {
      break;
    }
  }
  return current;
}
function displayText(text) {
  if (!text.includes('\\')) return text;
  return text
    .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)))
    .replace(/\\n/g, '\n')
    .replace(/\\r/g, '')
    .replace(/\\t/g, '\t')
    .replace(/\\"/g, '"');
}
function handleFrame(frame) {
  let event = '';
  const data = [];
  for (const line of frame.split('\n')) {
    if (!line) continue;
    if (line.startsWith(':')) { state.stream.lastPingAt = Date.now(); continue; }
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
  }
  if (event && data.length) onChunk(event, decodeChunk(data.join('\n')));
}
function onChunk(task, text) {
  const s = state.stream;
  const now = Date.now();
  if (s.task && s.task !== task) {
    s.task = task;
    s.raw = '';
    s.rendered = '';
    s.lastText = '';
    s.lastTextAt = 0;
    s.startedAt = state.awakeSince.get(task) || now;
    s.midTask = true;
    s.toolOnly = false;
    s.headerAt = 0;
    streamRefreshSoon();
  }
  s.lastChunkAt = now;
  if (!s.chunkTimes.length) s.headerAt = 0;
  s.chunkTimes.push(now);
  s.raw += text;
  if (s.raw.length > STREAM_MAX_CHARS) s.raw = s.raw.slice(s.raw.length - STREAM_MAX_CHARS);
}
function streamRefreshSoon() {
  const now = Date.now();
  if (now - state.stream.lastRefreshAt < 600) return;
  state.stream.lastRefreshAt = now;
  refresh();
}
function onStreamEnd() {
  const s = state.stream;
  if (s.status === 'idle') return;
  s.status = 'ended';
  s.rate = 0;
  s.observedStart = false;
  scheduleStreamRetry();
  streamRefreshSoon();
}
function scheduleStreamRetry(delay) {
  if (streamRetryTimer) return;
  const wait = delay != null ? delay : streamBackoff;
  streamBackoff = Math.min(streamBackoff * 2, 10000);
  streamRetryTimer = setTimeout(() => {
    streamRetryTimer = null;
    if (currentAwakeTask() && !document.hidden) connectStream();
    else closeStream();
  }, wait);
}
function closeStream() {
  if (streamAbort) { const a = streamAbort; streamAbort = null; a.abort(); }
  if (streamRetryTimer) { clearTimeout(streamRetryTimer); streamRetryTimer = null; }
  const s = state.stream;
  s.status = 'idle';
  s.task = null;
  s.raw = '';
  s.chunkTimes = [];
  s.rate = 0;
  s.midTask = false;
  s.toolOnly = false;
  s.lastText = '';
  s.lastTextAt = 0;
  s.rendered = '';
  s.lastChunkAt = null;
  s.lastPingAt = null;
  s.headerAt = 0;
  updateNodeActivity(0);
  tickLive();
}
function filterTail(raw) {
  const slice = raw.slice(Math.max(0, raw.length - STREAM_WINDOW_CHARS)).replace(/\r/g, '');
  const kept = [];
  let droppedAfter = false;
  for (const line of slice.split('\n')) {
    const t = line.trim();
    if (!t) continue;
    if (t.startsWith('```')) { if (kept.length) droppedAfter = true; continue; }
    const density = (t.match(/[{}\[\]"`]/g) || []).length / t.length;
    if (density > 0.2) { if (kept.length) droppedAfter = true; continue; }
    const prose = t.replace(/^[#>*\-\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
    if (prose) { kept.push(prose); droppedAfter = false; }
  }
  return { text: kept.slice(-STREAM_TAIL_LINES).join('\n'), droppedAfter };
}
function fmtDuration(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function liveStatusKey(s, age) {
  if (s.status === 'connecting') return 'connecting';
  if (s.status === 'ended') return 'ended';
  if (s.status !== 'open') return 'idle';
  if (age == null) return 'waiting';
  if (age * 1000 < STREAM_QUIET_MS) return 'streaming';
  if (age * 1000 < STREAM_STALL_MS) return 'quiet';
  return 'stalled';
}
function updateNodeActivity(level) {
  const s = state.stream;
  nodeL.selectAll('g.node.state-awake').each(function (d) {
    const on = s.status === 'open' && s.task === d.id;
    const sel = d3.select(this);
    sel.classed('live', on);
    if (on) sel.style('--activity', String(level));
    else sel.style('--activity', null);
  });
}
function tickLive() {
  const now = Date.now();
  const s = state.stream;
  const awake = currentAwakeTask();
  const closure = state.activeRootId ? getClosure(state.activeRootId) : null;
  const inRoot = !!(awake && closure && closure.has(awake.id));
  const active = s.status === 'open' || s.status === 'connecting' || s.status === 'ended';

  s.chunkTimes = s.chunkTimes.filter(t => now - t < 3000);
  const instant = s.chunkTimes.filter(t => now - t < 1000).length;
  s.rate = s.rate * 0.7 + instant * 0.3;
  if (awake && inRoot && (state.mode === 'run' || state.mode === 'map')) {
    updateNodeActivity(active ? Math.min(1, s.rate / 8) : 0);
  } else {
    updateNodeActivity(0);
  }

  const live = document.getElementById('live');
  const show = inRoot && state.mode === 'run' && !!live;
  if (!show) {
    if (live) live.classList.add('hidden');
    return;
  }
  live.classList.remove('hidden');

  const taskId = s.task || awake.id;
  const header = document.getElementById('live-task');
  const meta = document.getElementById('live-meta');
  const text = document.getElementById('live-text');
  const caret = document.getElementById('live-caret');
  if (!header || !meta || !text || !caret) return;

  const tail = active ? filterTail(displayText(s.raw)) : { text: '', droppedAfter: false };
  if (tail.text) { s.lastText = tail.text; s.lastTextAt = now; }
  s.toolOnly = tail.droppedAfter;
  const display = !active ? 'waiting for output…' : (s.midTask ? '… ' : '') + (s.lastText || 'waiting for output…');
  if (display !== s.rendered) {
    text.textContent = display;
    s.rendered = display;
    const box = document.getElementById('live-tail');
    if (box) box.scrollTop = box.scrollHeight;
  }

  const age = s.lastChunkAt ? (now - s.lastChunkAt) / 1000 : null;
  const key = liveStatusKey(s, age);
  caret.classList.toggle('quiet', key !== 'streaming');

  if (now - s.headerAt >= 900) {
    s.headerAt = now;
    const labels = {
      idle: 'waiting for output',
      connecting: 'connecting…',
      ended: 'stream ended · polling',
      waiting: 'waiting for output',
      streaming: 'streaming',
      quiet: 'quiet',
      stalled: `no output for ${Math.floor(age || 0)}s`,
    };
    const elapsed = fmtDuration(now - (state.awakeSince.get(taskId) || s.startedAt || now));
    header.textContent = (s.midTask ? '… ' : '') + taskId;
    meta.dataset.status = key;
    const bits = [labels[key] || ''];
    if (s.toolOnly) bits.push('tool output');
    bits.push(elapsed);
    if (age != null && key !== 'stalled') bits.push(`last ${Math.max(0, Math.floor(age))}s`);
    meta.textContent = bits.filter(Boolean).join(' · ');
  }
}

let pab = null, pt = null;
async function getTasks(sig) {
  const res = await fetch(TASKS_URL, { signal: sig, headers: { accept: 'application/json' }, cache: 'no-store' });
  if (!res.ok) throw new Error(String(res.status));
  return res.json();
}
async function refresh() {
  if (pab) pab.abort();
  pab = new AbortController();
  try {
    const env = await getTasks(pab.signal);
    if (pab.signal.aborted) return;
    state.error = null;
    applyEnvelope(env);
  } catch (e) {
    if (e.name === 'AbortError') return;
    state.error = String(e);
    paintTop();
    renderComposer();
  }
}
function poll() {
  if (!document.hidden) refresh();
  pt = setTimeout(poll, POLL_INTERVAL);
}
let stageHeight = 0, resizeTimer = null;
const stageObserver = new ResizeObserver(entries => {
  const h = entries[0].contentRect.height;

  if (Math.abs(h - stageHeight) < 80) return;
  stageHeight = h;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.mode === 'map' && state.layout && state.layout.bounds) fit();
  }, 150);
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) closeStream();
  else refresh();
});
window.addEventListener('pagehide', () => closeStream());

render();
if (!document.getElementById('composer-input').disabled) document.getElementById('composer-input').focus({ preventScroll: true });
